[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "pimpmycv"
version = "0.1.0"
description = "Tailor a LaTeX CV to a job description and compile it to PDF."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=2.46,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
]

[project.scripts]
pimpmycv = "pimpmycv.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/pimpmycv"]
