[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "pimpmycv"
version = "0.1.0"
description = "Tailor a LaTeX CV to a job description and compile it to PDF."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=2.46,<3",
  "pytest>=9.1,<10",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
gui = [
  "streamlit>=1.56,<2",
]

[project.scripts]
pimpmycv = "pimpmycv.cli:main"
pimpmycv-gui = "pimpmycv.gui:launch"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: exercises an installed local tool",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pimpmycv"]
